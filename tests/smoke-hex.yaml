            pr-title: Bump phoenix_pubsub from 1.0.2 to 1.1.2
            pr-body: |
                Bumps [phoenix_pubsub](https://github.com/phoenixframework/phoenix_pubsub) from 1.0.2 to 1.1.2.
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/phoenixframework/phoenix_pubsub/blob/v1.1.2/CHANGELOG.md">phoenix_pubsub's changelog</a>.</em></p>
                <blockquote>
                <h2>v1.1.2 (2019-02-23)</h2>
                <ul>
                <li>Bug fixes
                <ul>
                <li>Avoid warnings when running on Elixir v1.8</li>
                </ul>
                </li>
                </ul>
                <h2>v1.1.1 (2018-10-17)</h2>
                <ul>
                <li>Bug fixes
                <ul>
                <li>Fix issue causing empty deltas to be chosen for replication</li>
                <li>Improve replication over netsplit</li>
                </ul>
                </li>
                </ul>
                <h2>v1.1.0 (2018-08-10)</h2>
                <ul>
                <li>Enhancements
                <ul>
                <li>Optimize Tracker CRDT operations for increased performance</li>
                <li>Shard tracker internally to use pool of trackers for increased performance under load</li>
                <li>[Tracker] Add <code>get_by_key/3</code> to lookup a single presence entry for a given topic and key</li>
                </ul>
                </li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/49ec8315f2e52f63d1a6f9c8618f1d1877f31936"><code>49ec831</code></a> Release v1.1.2 with proper config</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/795887f8aa8492123ed6d1287883d85e83c085f0"><code>795887f</code></a> Release v1.1.2</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/316fdd8fd770c5c2744b0b2a9b9dc59952704ad6"><code>316fdd8</code></a> Don't use into with a non-empty list as this is deprecated in 1.8.0 (<a href="https://redirect.github.com/phoenixframework/phoenix_pubsub/issues/121">#121</a>)</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/50c1da2edd441b7af53dc646c92eaee3725a94a2"><code>50c1da2</code></a> Fix documentation (DocTest) for Phoenix.PubSub (<a href="https://redirect.github.com/phoenixframework/phoenix_pubsub/issues/119">#119</a>)</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/3f324a54848a37d4dae98954a4c70713c8df1d48"><code>3f324a5</code></a> Release 1.1.1</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/16faa0f8330bab5050ee12a7be6f7b482698a424"><code>16faa0f</code></a> fix typo on docs of Phoenix.Tracker.Clock funcs (<a href="https://redirect.github.com/phoenixframework/phoenix_pubsub/issues/114">#114</a>)</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/cc6d675269d304d2f8015be5d285e42631b421bf"><code>cc6d675</code></a> Improve replication over netsplit (<a href="https://redirect.github.com/phoenixframework/phoenix_pubsub/issues/111">#111</a>)</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/e5f3641f8b8d076cce5810dd1deb6fc6f868bbf9"><code>e5f3641</code></a> Choose delta dominating on common set of replicas (<a href="https://redirect.github.com/phoenixframework/phoenix_pubsub/issues/109">#109</a>)</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/ff03496d8649c750ffc10524bd4c7fc3ea7f61c2"><code>ff03496</code></a> Bump changelog</li>
                <li><a href="https://github.com/phoenixframework/phoenix_pubsub/commit/568d38bf0e4c0f49fcab10b7ace924a98125a699"><code>568d38b</code></a> Merge branch 'distributed-owls-non-dominating-empty-range'</li>
                <li>Additional commits viewable in <a href="https://github.com/phoenixframework/phoenix_pubsub/compare/v1.0.2...v1.1.2">compare view</a></li>
                </ul>
                </details>
