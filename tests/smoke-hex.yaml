            pr-title: Bump mime from 1.2.0 to 1.6.0
            pr-body: |
                Bumps [mime](https://github.com/elixir-plug/mime) from 1.2.0 to 1.6.0.
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/elixir-plug/mime/blob/master/CHANGELOG.md">mime's changelog</a>.</em></p>
                <blockquote>
                <h2>v1.6.0</h2>
                <ul>
                <li>Deprecate MIME.valid?</li>
                <li>Ignore media type params</li>
                <li>Detect subtype suffix according to the spec</li>
                </ul>
                <h2>v1.5.0</h2>
                <ul>
                <li>Compare extensions in a case-insensitive way (see
                <a href="https://redirect.github.com/elixir-plug/mime/issues/38">elixir-plug/mime#38</a>).</li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/elixir-plug/mime/commit/4cd565627ed45b283c3d7481b6f1c1412f7d2878"><code>4cd5656</code></a> Release v1.6.0</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/a1523bffa2cb25745d92b938f9104e9de0aa480e"><code>a1523bf</code></a> Ignore params and detect subtype suffix in extensions/1 (<a href="https://redirect.github.com/elixir-plug/mime/issues/45">#45</a>)</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/b9da4cb47d3994301c97eeba806f1a7e7787bd29"><code>b9da4cb</code></a> Update CI config (<a href="https://redirect.github.com/elixir-plug/mime/issues/44">#44</a>)</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/4a538c58ab73b8ef1400c29f330db0dc7606f04e"><code>4a538c5</code></a> Release v1.5.0</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/4336bc1365a103e5eae2ba1b4d28f1d354ff10ff"><code>4336bc1</code></a> Release v1.4.1</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/36ac39976f0fad64fa6b45f4dcb158f3329a4181"><code>36ac399</code></a> Add CI on GitHub Actions and stop using Travis CI (<a href="https://redirect.github.com/elixir-plug/mime/issues/41">#41</a>)</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/982dff19f0cfd7879d856f237212709e020529c6"><code>982dff1</code></a> Update (<a href="https://redirect.github.com/elixir-plug/mime/issues/40">#40</a>)</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/1af476abf9da04241bf15fa46a69097f6d3cdaed"><code>1af476a</code></a> Downcase extensions and mime types in extensions (<a href="https://redirect.github.com/elixir-plug/mime/issues/39">#39</a>)</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/389c953edb6c335b35976a77f305108b4754484d"><code>389c953</code></a> Release v1.4.0</li>
                <li><a href="https://github.com/elixir-plug/mime/commit/e9e8bd158ed65333f2b5083d311c0f1b595acd2e"><code>e9e8bd1</code></a> Update mime.types: Sync with IANA as of  2020-04-22 (<a href="https://redirect.github.com/elixir-plug/mime/issues/36">#36</a>)</li>
                <li>Additional commits viewable in <a href="https://github.com/elixir-plug/mime/compare/v1.2.0...v1.6.0">compare view</a></li>
                </ul>
                </details>
                <br />
            commit-message: |-
                Bump mime from 1.2.0 to 1.6.0

                Bumps [mime](https://github.com/elixir-plug/mime) from 1.2.0 to 1.6.0.
                - [Changelog](https://github.com/elixir-plug/mime/blob/master/CHANGELOG.md)
                - [Commits](https://github.com/elixir-plug/mime/compare/v1.2.0...v1.6.0)
