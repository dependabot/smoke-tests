            pr-title: Bump the pip group across 2 directories with 3 updates
            pr-body: |
                Bumps the pip group with 2 updates in the /pip/multi-dir/foo directory: [urllib3](https://github.com/urllib3/urllib3) and [flask](https://github.com/pallets/flask).
                Bumps the pip group with 2 updates in the /pip/multi-dir/bar directory: [urllib3](https://github.com/urllib3/urllib3) and [numpy](https://github.com/numpy/numpy).

                Updates `urllib3` from 1.0 to 1.0.1
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/urllib3/urllib3/blob/main/CHANGES.rst">urllib3's changelog</a>.</em></p>
                <blockquote>
                <h1>1.0.1 (2011-10-10)</h1>
                <ul>
                <li>Fixed a bug where the same connection would get returned into the pool twice,
                causing extraneous &quot;HttpConnectionPool is full&quot; log warnings.</li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/urllib3/urllib3/commit/9f6e2eaae4b8ef84b6d3dddf55197c4d17946ca1"><code>9f6e2ea</code></a> Version bump to 1.0.1</li>
                <li><a href="https://github.com/urllib3/urllib3/commit/231b75492c85692ec307fb9606dbaabff0a80754"><code>231b754</code></a> Added test which fails when double release bug exists.</li>
                <li><a href="https://github.com/urllib3/urllib3/commit/9f7306fed618577ca89d0d355e8f51027aaeb54d"><code>9f7306f</code></a> Bug fix: Connection was double-released when preload_content=True.</li>
                <li>See full diff in <a href="https://github.com/urllib3/urllib3/compare/1.0...1.0.1">compare view</a></li>
                </ul>
                </details>
                <br />

                Updates `flask` from 2.0.0 to 2.0.1
                <details>
                <summary>Release notes</summary>
                <p><em>Sourced from <a href="https://github.com/pallets/flask/releases">flask's releases</a>.</em></p>
                <blockquote>
                <h2>2.0.1</h2>
                <ul>
                <li>Changes: <a href="https://flask.palletsprojects.com/en/2.0.x/changes/#version-2-0-1">https://flask.palletsprojects.com/en/2.0.x/changes/#version-2-0-1</a></li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/pallets/flask/blob/main/CHANGES.rst">flask's changelog</a>.</em></p>
                <blockquote>
                <h2>Version 2.0.1</h2>
                <p>Released 2021-05-21</p>
                <ul>
                <li>Re-add the <code>filename</code> parameter in <code>send_from_directory</code>. The
                <code>filename</code> parameter has been renamed to <code>path</code>, the old name
                is deprecated. :pr:<code>4019</code></li>
                <li>Mark top-level names as exported so type checking understands
                imports in user projects. :issue:<code>4024</code></li>
                <li>Fix type annotation for <code>g</code> and inform mypy that it is a namespace
                object that has arbitrary attributes. :issue:<code>4020</code></li>
                <li>Fix some types that weren't available in Python 3.6.0. :issue:<code>4040</code></li>
                <li>Improve typing for <code>send_file</code>, <code>send_from_directory</code>, and
                <code>get_send_file_max_age</code>. :issue:<code>4044</code>, :pr:<code>4026</code></li>
                <li>Show an error when a blueprint name contains a dot. The <code>.</code> has
                special meaning, it is used to separate (nested) blueprint names and
                the endpoint name. :issue:<code>4041</code></li>
                <li>Combine URL prefixes when nesting blueprints that were created with
                a <code>url_prefix</code> value. :issue:<code>4037</code></li>
                <li>Revert a change to the order that URL matching was done. The
                URL is again matched after the session is loaded, so the session is
                available in custom URL converters. :issue:<code>4053</code></li>
                <li>Re-add deprecated <code>Config.from_json</code>, which was accidentally
                removed early. :issue:<code>4078</code></li>
                <li>Improve typing for some functions using <code>Callable</code> in their type
                signatures, focusing on decorator factories. :issue:<code>4060</code></li>
                <li>Nested blueprints are registered with their dotted name. This allows
                different blueprints with the same name to be nested at different
                locations. :issue:<code>4069</code></li>
                <li><code>register_blueprint</code> takes a <code>name</code> option to change the
                (pre-dotted) name the blueprint is registered with. This allows the
                same blueprint to be registered multiple times with unique names for
                <code>url_for</code>. Registering the same blueprint with the same name
                multiple times is deprecated. :issue:<code>1091</code></li>
                <li>Improve typing for <code>stream_with_context</code>. :issue:<code>4052</code></li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/pallets/flask/commit/bc90801c2ada42d3cf112a3b5701bfdbb8b6211c"><code>bc90801</code></a> Merge pull request <a href="https://redirect.github.com/pallets/flask/issues/4091">#4091</a> from pallets/release-2.0.1</li>
                <li><a href="https://github.com/pallets/flask/commit/fe2d744b530283094dd0a2ffa4a9d86f1029b2cd"><code>fe2d744</code></a> release version 2.0.1</li>
                <li><a href="https://github.com/pallets/flask/commit/9f606a8cbb8755eaa4664ce7a4f892204f140410"><code>9f606a8</code></a> Merge pull request <a href="https://redirect.github.com/pallets/flask/issues/4090">#4090</a> from pallets/stream-type</li>
                <li><a href="https://github.com/pallets/flask/commit/7ab934f6bc2380a322c77d92c0b6cfd10b7de991"><code>7ab934f</code></a> improve typing for <code>stream_with_context</code></li>
                <li><a href="https://github.com/pallets/flask/commit/6b1c4e9769cbe72d6f5665a8081a98e5a671a8d8"><code>6b1c4e9</code></a> Merge pull request <a href="https://redirect.github.com/pallets/flask/issues/4087">#4087</a> from greyli/gitignore</li>
                <li><a href="https://github.com/pallets/flask/commit/255461d8950fab51a44c84f33cfba1e4fb239a7d"><code>255461d</code></a> Merge pull request <a href="https://redirect.github.com/pallets/flask/issues/4074">#4074</a> from pgjones/bp</li>
                <li><a href="https://github.com/pallets/flask/commit/3257b7574e7f010686a617197e0fb4596986f7f7"><code>3257b75</code></a> Fix blueprint renaming</li>
                <li><a href="https://github.com/pallets/flask/commit/714b0a467acab54091d8aeb73403d808abfbcf5b"><code>714b0a4</code></a> Fix blueprint self registration</li>
                <li><a href="https://github.com/pallets/flask/commit/9409be6e34e153bfdb0aac2c9eb7f60110109172"><code>9409be6</code></a> warn when registering same blueprint with same name</li>
                <li><a href="https://github.com/pallets/flask/commit/63b306743fccdd52079034e82cbbeee182a4361d"><code>63b3067</code></a> changelog for blueprint registered name</li>
                <li>Additional commits viewable in <a href="https://github.com/pallets/flask/compare/2.0.0...2.0.1">compare view</a></li>
                </ul>
                </details>
                <br />

                Updates `urllib3` from 1.0 to 1.0.1
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/urllib3/urllib3/blob/main/CHANGES.rst">urllib3's changelog</a>.</em></p>
                <blockquote>
                <h1>1.0.1 (2011-10-10)</h1>
                <ul>
                <li>Fixed a bug where the same connection would get returned into the pool twice,
                causing extraneous &quot;HttpConnectionPool is full&quot; log warnings.</li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/urllib3/urllib3/commit/9f6e2eaae4b8ef84b6d3dddf55197c4d17946ca1"><code>9f6e2ea</code></a> Version bump to 1.0.1</li>
                <li><a href="https://github.com/urllib3/urllib3/commit/231b75492c85692ec307fb9606dbaabff0a80754"><code>231b754</code></a> Added test which fails when double release bug exists.</li>
                <li><a href="https://github.com/urllib3/urllib3/commit/9f7306fed618577ca89d0d355e8f51027aaeb54d"><code>9f7306f</code></a> Bug fix: Connection was double-released when preload_content=True.</li>
                <li>See full diff in <a href="https://github.com/urllib3/urllib3/compare/1.0...1.0.1">compare view</a></li>
                </ul>
                </details>
                <br />

                Updates `numpy` from 1.0 to 1.3.0
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/numpy/numpy/commit/c3e0147d49286c0cb1b65a95d42f5eb4a4779129"><code>c3e0147</code></a> Release 1.3.0.</li>
                <li><a href="https://github.com/numpy/numpy/commit/66d80f358d10fede3743809eceba32a47f103907"><code>66d80f3</code></a> Backport 6839 and 6840 from trunk.</li>
                <li><a href="https://github.com/numpy/numpy/commit/22b5beed3f4c15d905f589189b5d526e29fb823c"><code>22b5bee</code></a> Start RC3.</li>
                <li><a href="https://github.com/numpy/numpy/commit/2f9063f598515a2708decd55a13cd5672851047f"><code>2f9063f</code></a> RC2 for 1.3.0.</li>
                <li><a href="https://github.com/numpy/numpy/commit/adb7e7074f7578de230d3aa54d3ad17cc929b1c2"><code>adb7e70</code></a> Backport 6833-6834 to 1.3.x.</li>
                <li><a href="https://github.com/numpy/numpy/commit/8601c3446a52e7f7b70c830be6ebb9e2d10700ed"><code>8601c34</code></a> Backport r6827 to fix ticket <a href="https://redirect.github.com/numpy/numpy/issues/1039">#1039</a></li>
                <li><a href="https://github.com/numpy/numpy/commit/2131d92751c32cf69ffe9689c09bb1d5b61013a6"><code>2131d92</code></a> 1.3.x backport r6820, r6821: Fix docstring formatting (blocks doc build)</li>
                <li><a href="https://github.com/numpy/numpy/commit/b6a2b941a35509758784bf9aed308b04dac5f8a5"><code>b6a2b94</code></a> 1.3.x backport 6818: Move routines.testing.rst to the correct place</li>
                <li><a href="https://github.com/numpy/numpy/commit/4a5e87298925e42cc7727f18134e0d8bee0c4291"><code>4a5e872</code></a> 1.3.x backport r6816: Enable docstrings for fmin and fmax</li>
                <li><a href="https://github.com/numpy/numpy/commit/58ac9c480a230d4cb8029b9666150601632ef04f"><code>58ac9c4</code></a> Bump to rc2.</li>
                <li>Additional commits viewable in <a href="https://github.com/numpy/numpy/compare/v1.0...v1.3.0">compare view</a></li>
                </ul>
                </details>
                <br />
            commit-message: |-
                Bump the pip group across 2 directories with 3 updates

                Bumps the pip group with 2 updates in the /pip/multi-dir/foo directory: [urllib3](https://github.com/urllib3/urllib3) and [flask](https://github.com/pallets/flask).
                Bumps the pip group with 2 updates in the /pip/multi-dir/bar directory: [urllib3](https://github.com/urllib3/urllib3) and [numpy](https://github.com/numpy/numpy).


                Updates `urllib3` from 1.0 to 1.0.1
                - [Release notes](https://github.com/urllib3/urllib3/releases)
                - [Changelog](https://github.com/urllib3/urllib3/blob/main/CHANGES.rst)
                - [Commits](https://github.com/urllib3/urllib3/compare/1.0...1.0.1)

                Updates `flask` from 2.0.0 to 2.0.1
                - [Release notes](https://github.com/pallets/flask/releases)
                - [Changelog](https://github.com/pallets/flask/blob/main/CHANGES.rst)
                - [Commits](https://github.com/pallets/flask/compare/2.0.0...2.0.1)

                Updates `urllib3` from 1.0 to 1.0.1
                - [Release notes](https://github.com/urllib3/urllib3/releases)
                - [Changelog](https://github.com/urllib3/urllib3/blob/main/CHANGES.rst)
                - [Commits](https://github.com/urllib3/urllib3/compare/1.0...1.0.1)

