input:
    job:
        command: update
        package-manager: pip
        allowed-updates:
            - dependency-type: direct
              update-type: all
        dependency-groups:
            - name: pip
              applies-to: security-updates
              rules:
                patterns:
                    - '*'
        dependencies:
            - urllib3
            - numpy
            - Flask
        ignore-conditions:
            - dependency-name: django
              source: tests/smoke-pip.yaml
              version-requirement: '>4.0.6'
        security-advisories:
            - dependency-name: Flask
              affected-versions:
                - <= 2.0.0
              patched-versions: []
              unaffected-versions: []
            - dependency-name: numpy
              affected-versions:
                - <= 1.0.0
              patched-versions: []
              unaffected-versions: []
            - dependency-name: urllib3
              affected-versions:
                - <= 1.0.0
              patched-versions: []
              unaffected-versions: []
        security-updates-only: true
        source:
            provider: github
            repo: dependabot/smoke-tests
            directories:
                - /pip/multi-dir/foo
                - /pip/multi-dir/bar
            commit: 0962713db3cb346a729e68bc86706ac7372f9067
    credentials:
        - host: github.com
          password: $LOCAL_GITHUB_ACCESS_TOKEN
          type: git_source
          username: x-access-token
