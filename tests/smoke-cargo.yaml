            pr-title: Bump getrandom from 0.2.9 to 0.2.17 in /cargo
            pr-body: |
                Bumps [getrandom](https://github.com/rust-random/getrandom) from 0.2.9 to 0.2.17.
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/rust-random/getrandom/blob/master/CHANGELOG.md">getrandom's changelog</a>.</em></p>
                <blockquote>
                <h2><a href="https://github.com/rust-random/getrandom/compare/v0.2.16...v0.2.17">0.2.17</a> - 2026-01-12</h2>
                <h3>Fixed</h3>
                <ul>
                <li>Use <code>doc_cfg</code> instead of <code>doc_auto_cfg</code> (partial backport of <a href="https://redirect.github.com/rust-random/getrandom/issues/732">#732</a>) <a href="https://redirect.github.com/rust-random/getrandom/issues/768">#768</a></li>
                <li><code>BCryptGenRandom</code> signature <a href="https://redirect.github.com/rust-random/getrandom/issues/778">#778</a></li>
                </ul>
                <p><a href="https://redirect.github.com/rust-random/getrandom/issues/732">#732</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/732">rust-random/getrandom#732</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/768">#768</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/768">rust-random/getrandom#768</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/778">#778</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/778">rust-random/getrandom#778</a></p>
                <h2><a href="https://github.com/rust-random/getrandom/compare/v0.2.15...v0.2.16">0.2.16</a> - 2025-04-22</h2>
                <h3>Added</h3>
                <ul>
                <li>Cygwin support (backport of <a href="https://redirect.github.com/rust-random/getrandom/issues/626">#626</a>) <a href="https://redirect.github.com/rust-random/getrandom/issues/654">#654</a></li>
                </ul>
                <p><a href="https://redirect.github.com/rust-random/getrandom/issues/654">#654</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/654">rust-random/getrandom#654</a></p>
                <h2><a href="https://github.com/rust-random/getrandom/compare/v0.2.14...v0.2.15">0.2.15</a> - 2024-05-06</h2>
                <h3>Added</h3>
                <ul>
                <li>Apple visionOS support <a href="https://redirect.github.com/rust-random/getrandom/issues/410">#410</a></li>
                </ul>
                <h3>Changed</h3>
                <ul>
                <li>Use <code>libc::getrandom</code> on DragonflyBSD, FreeBSD, illumos, and Solaris <a href="https://redirect.github.com/rust-random/getrandom/issues/411">#411</a> <a href="https://redirect.github.com/rust-random/getrandom/issues/416">#416</a> <a href="https://redirect.github.com/rust-random/getrandom/issues/417">#417</a> <a href="https://redirect.github.com/rust-random/getrandom/issues/420">#420</a></li>
                <li>Unify <code>libc::getentropy</code>-based implementations <a href="https://redirect.github.com/rust-random/getrandom/issues/418">#418</a></li>
                </ul>
                <p><a href="https://redirect.github.com/rust-random/getrandom/issues/410">#410</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/410">rust-random/getrandom#410</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/411">#411</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/411">rust-random/getrandom#411</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/416">#416</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/416">rust-random/getrandom#416</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/417">#417</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/417">rust-random/getrandom#417</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/418">#418</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/418">rust-random/getrandom#418</a>
                <a href="https://redirect.github.com/rust-random/getrandom/issues/420">#420</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/420">rust-random/getrandom#420</a></p>
                <h2><a href="https://github.com/rust-random/getrandom/compare/v0.2.13...v0.2.14">0.2.14</a> - 2024-04-08</h2>
                <h3>Fixed</h3>
                <ul>
                <li>Enable <code>/dev/urandom</code> fallback for MUSL-based Linux targets <a href="https://redirect.github.com/rust-random/getrandom/issues/408">#408</a></li>
                </ul>
                <p><a href="https://redirect.github.com/rust-random/getrandom/issues/408">#408</a>: <a href="https://redirect.github.com/rust-random/getrandom/pull/408">rust-random/getrandom#408</a></p>
                <h2>[0.2.13] - 2024-04-06</h2>
                <h3>Added</h3>
                <ul>
                <li><code>linux_disable_fallback</code> crate feature to disable <code>/dev/urandom</code>-based fallback on Linux and
                Android targets. Enabling this feature bumps minimum supported Linux kernel version to 3.17 and
                Android API level to 23 (Marshmallow). <a href="https://redirect.github.com/rust-random/getrandom/issues/396">#396</a></li>
                </ul>
                <h3>Changed</h3>
                <ul>
                <li>Disable <code>/dev/urandom</code> fallback for Linux targets outside of the following <code>target_arch</code>es:
                <code>aarch64</code>, <code>arm</code>, <code>powerpc</code>, <code>powerpc64</code>, <code>s390x</code>, <code>x86</code>, <code>x86_64</code> <a href="https://redirect.github.com/rust-random/getrandom/issues/396">#396</a></li>
                <li>Do not catch <code>EPERM</code> error code on Android while checking availability of</li>
                </ul>
                <!-- raw HTML omitted -->
                </blockquote>
                <p>... (truncated)</p>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/rust-random/getrandom/commit/b625985d852600a3eeb68556811e59e7c9a6a098"><code>b625985</code></a> Release 0.2.17 (<a href="https://redirect.github.com/rust-random/getrandom/issues/774">#774</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/e7200ad523fcf0a800d28a2d8c9cfe3e375ad916"><code>e7200ad</code></a> windows: fix <code>BCryptGenRandom</code> signature (<a href="https://redirect.github.com/rust-random/getrandom/issues/778">#778</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/3ae6e752897928871d0d4ee93e2c179c9a126fa0"><code>3ae6e75</code></a> Backport <a href="https://redirect.github.com/rust-random/getrandom/issues/768">#768</a> (doc_cfg)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/ce4144b2c16fe1422037c93e267e6a52336e0834"><code>ce4144b</code></a> Release v0.2.16 (<a href="https://redirect.github.com/rust-random/getrandom/issues/655">#655</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/a55ea8dcb8daef83a95603e77a563a346b4a2785"><code>a55ea8d</code></a> Backport Cygwin support (<a href="https://redirect.github.com/rust-random/getrandom/issues/654">#654</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/cf65e83f9df8954df101320de86f80dccfc6b68a"><code>cf65e83</code></a> Release v0.2.15 (<a href="https://redirect.github.com/rust-random/getrandom/issues/419">#419</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/a24538f0983d385b21f8851ce338bdc0ecb360a1"><code>a24538f</code></a> Remove .cargo/config (<a href="https://redirect.github.com/rust-random/getrandom/issues/421">#421</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/229d87004d33316664fd5c891f96b6b29972c080"><code>229d870</code></a> Use libc::getrandom on Solaris and update docs. (<a href="https://redirect.github.com/rust-random/getrandom/issues/420">#420</a>)</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/924c88d761b90d87b9fe9d15c7c8a5e15d28d8a8"><code>924c88d</code></a> Unconditionally use <code>libc::getrandom</code> on Illumos and <code>libc::geentropy</code> on Sol...</li>
                <li><a href="https://github.com/rust-random/getrandom/commit/20c22138d5c48993e6d03bb3ce23f87ee3e0887f"><code>20c2213</code></a> Unify getentropy-based implementations (<a href="https://redirect.github.com/rust-random/getrandom/issues/418">#418</a>)</li>
                <li>Additional commits viewable in <a href="https://github.com/rust-random/getrandom/compare/v0.2.9...v0.2.17">compare view</a></li>
                </ul>
                </details>
                <br />
