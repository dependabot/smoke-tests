                <ul>
                <li>
                <p>Improve Windows host support by workaround <a href="https://redirect.github.com/rust-lang/rust/pull/125205">rustc bug fixed in Rust 1.84</a>.</p>
                </li>
                <li>
                <p>Respect <a href="https://redirect.github.com/rust-lang/rust/pull/132993"><code>RUSTC_BOOTSTRAP=-1</code> recently added in nightly</a> in rustc version detection.</p>
