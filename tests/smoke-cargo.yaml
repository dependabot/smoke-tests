            pr-title: Bump cfg-if from 1.0.0 to 1.0.4 in /cargo
            pr-body: |
                Bumps [cfg-if](https://github.com/rust-lang/cfg-if) from 1.0.0 to 1.0.4.
                <details>
                <summary>Release notes</summary>
                <p><em>Sourced from <a href="https://github.com/rust-lang/cfg-if/releases">cfg-if's releases</a>.</em></p>
                <blockquote>
                <h2>v1.0.4</h2>
                <ul>
                <li>Support <code>cfg(true)</code> and <code>cfg(false)</code> (<a href="https://redirect.github.com/rust-lang/cfg-if/pull/99">#99</a>)</li>
                <li>Set and test a MSRV of 1.32</li>
                <li>Have a single top-level rule</li>
                </ul>
                <h2>v1.0.3</h2>
                <ul>
                <li>Revert &quot;Remove <code>@__identity</code> rule.&quot;</li>
                </ul>
                <h2>v1.0.2</h2>
                <ul>
                <li>Remove <code>@__identity</code> rule.</li>
                </ul>
                <h2>v1.0.1</h2>
                <h3>Other</h3>
                <ul>
                <li>Remove <code>compiler-builtins</code> from <code>rustc-dep-of-std</code> dependencies</li>
                <li>Remove redundant configuration from Cargo.toml</li>
                <li>More readable formatting and identifier names. (<a href="https://redirect.github.com/rust-lang/cfg-if/pull/39">#39</a>)</li>
                <li>Add expanded example to readme (<a href="https://redirect.github.com/rust-lang/cfg-if/pull/38">#38</a>)</li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Changelog</summary>
                <p><em>Sourced from <a href="https://github.com/rust-lang/cfg-if/blob/main/CHANGELOG.md">cfg-if's changelog</a>.</em></p>
                <blockquote>
                <h2><a href="https://github.com/rust-lang/cfg-if/compare/v1.0.3...v1.0.4">1.0.4</a> - 2025-10-15</h2>
                <ul>
                <li>Support <code>cfg(true)</code> and <code>cfg(false)</code> (<a href="https://redirect.github.com/rust-lang/cfg-if/pull/99">#99</a>)</li>
                <li>Set and test a MSRV of 1.32</li>
                <li>Have a single top-level rule</li>
                </ul>
                <h2><a href="https://github.com/rust-lang/cfg-if/compare/v1.0.2...v1.0.3">1.0.3</a> - 2025-08-19</h2>
                <ul>
                <li>Revert &quot;Remove <code>@__identity</code> rule.&quot;</li>
                </ul>
                <h2><a href="https://github.com/rust-lang/cfg-if/compare/v1.0.1...v1.0.2">1.0.2</a> - 2025-08-19</h2>
                <ul>
                <li>Remove <code>@__identity</code> rule.</li>
                </ul>
                <h2><a href="https://github.com/rust-lang/cfg-if/compare/v1.0.0...v1.0.1">1.0.1</a> - 2025-06-09</h2>
                <ul>
                <li>Remove <code>compiler-builtins</code> from <code>rustc-dep-of-std</code> dependencies</li>
                <li>Remove redundant configuration from Cargo.toml</li>
                <li>More readable formatting and identifier names. (<a href="https://redirect.github.com/rust-lang/cfg-if/pull/39">#39</a>)</li>
                <li>Add expanded example to readme (<a href="https://redirect.github.com/rust-lang/cfg-if/pull/38">#38</a>)</li>
                </ul>
                </blockquote>
                </details>
                <details>
                <summary>Commits</summary>
                <ul>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/3510ca6abea34cbbc702509a4e50ea9709925eda"><code>3510ca6</code></a> chore: release v1.0.4 (<a href="https://redirect.github.com/rust-lang/cfg-if/issues/95">#95</a>)</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/15aec4a67e633254e726bf477b8b86c65687bfc6"><code>15aec4a</code></a> Support <code>cfg(true)</code> and <code>cfg(false)</code> (<a href="https://redirect.github.com/rust-lang/cfg-if/issues/99">#99</a>)</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/036c64ec85ed9eb80692c85ff6b29da3a3a1bfcf"><code>036c64e</code></a> Set and test a MSRV of 1.32</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/5fd566f9f02cb0d2194b0ccb4b3b81857f479c0d"><code>5fd566f</code></a> Set <code>-Dwarnings</code> via CI env rather than <code>cfg</code></li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/8ef8e9ffa8fb39c823ff61b4ad2a85c2f0a376c4"><code>8ef8e9f</code></a> Have a single top-level rule.</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/2400b383890ba7ab7f71bc2437549f4a080a543b"><code>2400b38</code></a> Document and test for a subtle case.</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/9c7bb0bf7184698c16ba60aad424b9b8263ac6db"><code>9c7bb0b</code></a> chore: release v1.0.3 (<a href="https://redirect.github.com/rust-lang/cfg-if/issues/93">#93</a>)</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/145894c77e6c5d080e9b634f153e5583086f6000"><code>145894c</code></a> Revert &quot;Remove <code>@__identity</code> rule.&quot;</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/9f747fecddfd28eae608f60970987b14252457f5"><code>9f747fe</code></a> chore: release v1.0.2 (<a href="https://redirect.github.com/rust-lang/cfg-if/issues/88">#88</a>)</li>
                <li><a href="https://github.com/rust-lang/cfg-if/commit/97739b8388a715ab9ccab767e1fe45838d97dcb8"><code>97739b8</code></a> Fix some ugly and inconsistent formatting.</li>
                <li>Additional commits viewable in <a href="https://github.com/rust-lang/cfg-if/compare/1.0.0...v1.0.4">compare view</a></li>
                </ul>
                </details>
                <br />
            commit-message: |-
                Bump cfg-if from 1.0.0 to 1.0.4 in /cargo

                Bumps [cfg-if](https://github.com/rust-lang/cfg-if) from 1.0.0 to 1.0.4.
                - [Release notes](https://github.com/rust-lang/cfg-if/releases)
                - [Changelog](https://github.com/rust-lang/cfg-if/blob/main/CHANGELOG.md)
                - [Commits](https://github.com/rust-lang/cfg-if/compare/1.0.0...v1.0.4)
