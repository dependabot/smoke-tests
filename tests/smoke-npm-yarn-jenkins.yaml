            pr-title: Bump typescript from 5.8.2 to 5.8.3 in /yarn-jenkins
            pr-body: "Bumps [typescript](https://github.com/microsoft/TypeScript) from 5.8.2 to 5.8.3.\n<details>\n<summary>Release notes</summary>\n<p><em>Sourced from <a href=\"https://github.com/microsoft/TypeScript/releases\">typescript's releases</a>.</em></p>\n<blockquote>\n<h2>TypeScript 5.8.3</h2>\n<p>Note: this tag was recreated to point at the correct commit. The npm package contained the correct content.</p>\n<p>For release notes, check out the <a href=\"https://devblogs.microsoft.com/typescript/announcing-typescript-5-8/\">release announcement</a>.</p>\n<ul>\n<li><a href=\"https://github.com/Microsoft/TypeScript/issues?utf8=%E2%9C%93&amp;q=milestone%3A%22TypeScript+5.8.0%22+is%3Aclosed+\">fixed issues query for Typescript 5.8.0 (Beta)</a>.</li>\n<li><a href=\"https://github.com/Microsoft/TypeScript/issues?utf8=%E2%9C%93&amp;q=milestone%3A%22TypeScript+5.8.1%22+is%3Aclosed+\">fixed issues query for Typescript 5.8.1 (RC)</a>.</li>\n<li><a href=\"https://github.com/Microsoft/TypeScript/issues?utf8=%E2%9C%93&amp;q=milestone%3A%22TypeScript+5.8.2%22+is%3Aclosed+\">fixed issues query for Typescript 5.8.2 (Stable)</a>.</li>\n<li><a href=\"https://github.com/Microsoft/TypeScript/issues?utf8=%E2%9C%93&amp;q=milestone%3A%22TypeScript+5.8.3%22+is%3Aclosed+\">fixed issues query for Typescript 5.8.3 (Stable)</a>.</li>\n</ul>\n<p>Downloads are available on:</p>\n<ul>\n<li><a href=\"https://www.npmjs.com/package/typescript\">npm</a></li>\n</ul>\n</blockquote>\n</details>\n<details>\n<summary>Commits</summary>\n<ul>\n<li><a href=\"https://github.com/microsoft/TypeScript/commit/68cead182cc24afdc3f1ce7c8ff5853aba14b65a\"><code>68cead1</code></a> Bump version to 5.8.3 and LKG</li>\n<li><a href=\"https://github.com/microsoft/TypeScript/commit/92eedcb6be175f8dd3b5bd2023eac14d64ff8f47\"><code>92eedcb</code></a> \U0001F916 Pick PR <a href=\"https://redirect.github.com/microsoft/TypeScript/issues/61452\">#61452</a> (Fix errors on type assertions in er...) into release-5.8 (#...</li>\n<li><a href=\"https://github.com/microsoft/TypeScript/commit/88a002a1eade4b2271364919bd684547f0fb44f7\"><code>88a002a</code></a> \U0001F916 Pick PR <a href=\"https://redirect.github.com/microsoft/TypeScript/issues/61261\">#61261</a> (Fixed accidentally reused comments ...) into release-5.8 (#...</li>\n<li><a href=\"https://github.com/microsoft/TypeScript/commit/021dba5c83ee2f0d56a83a324663c6322a895f5a\"><code>021dba5</code></a> \U0001F916 Pick PR <a href=\"https://redirect.github.com/microsoft/TypeScript/issues/61342\">#61342</a> (Rename type parameters when they ar...) into release-5.8 (#...</li>\n<li><a href=\"https://github.com/microsoft/TypeScript/commit/fca87f27213f0423ba786dac80bae6965c8dd828\"><code>fca87f2</code></a> \U0001F916 Pick PR <a href=\"https://redirect.github.com/microsoft/TypeScript/issues/61244\">#61244</a> (Ban old-style type assertions under...) into release-5.8 (#...</li>\n<li><a href=\"https://github.com/microsoft/TypeScript/commit/f6b94db7d4b985726786178eefecc2ee48ce2a27\"><code>f6b94db</code></a> \U0001F916 Pick PR <a href=\"https://redirect.github.com/microsoft/TypeScript/issues/61392\">#61392</a> (Fix serialization of accessor types...) into release-5.8 (#...</li>\n<li>See full diff in <a href=\"https://github.com/microsoft/TypeScript/compare/v5.8.2...v5.8.3\">compare view</a></li>\n</ul>\n</details>\n<br />\n"
            commit-message: |-
                Bump typescript from 5.8.2 to 5.8.3 in /yarn-jenkins

