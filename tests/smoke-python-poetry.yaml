                    - file: pyproject.toml
                      groups:
                        - dependencies
                      requirement: 1.23.0
                      source: null
                  version: 1.23.0
                - name: requests
                  requirements:
                    - file: pyproject.toml
                      groups:
                        - dependencies
                      requirement: 2.28.0
                      source: null
                  version: null
            dependency_files:
                - /poetry/pyproject.toml
                - /poetry/poetry.lock
    - type: create_pull_request
